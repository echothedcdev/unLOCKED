<body>

  <div class="browser">

    <!-- Toolbar -->
    <div class="toolbar">

      <div class="logo">
        <div class="logo-icon">🔓</div>
        <span>unLOCKED</span>
      </div>

      <button
        class="nav-button"
        id="backButton"
        title="Back"
        aria-label="Back">
        ←
      </button>

      <button
        class="nav-button"
        id="forwardButton"
        title="Forward"
        aria-label="Forward">
        →
      </button>

      <button
        class="nav-button"
        id="reloadButton"
        title="Reload"
        aria-label="Reload">
        ↻
      </button>

      <div class="address-area">

        <span class="lock">🔒</span>

        <input
          id="urlInput"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="Enter a website..."
        >

        <button id="goButton">
          Go
        </button>

      </div>

    </div>

    <!-- Viewer -->
    <div class="viewer-container">

      <!-- Home -->
      <div class="home-screen" id="homeScreen">

        <div class="home-card">

          <h1>🔓 unLOCKED</h1>

          <p>
            A simple web viewer made by Ech0playsss.
          </p>

          <!-- Canva Design -->
          <div class="canva-preview">

            <iframe
              loading="lazy"
              src="https://www.canva.com/design/DAHXHNh3jek/I8D-X7QRVPHShpigaz8IAA/view?embed"
              allowfullscreen
              allow="fullscreen">
            </iframe>

          </div>

          <a
            class="canva-credit"
            href="https://www.canva.com/design/DAHXHNh3jek/I8D-X7QRVPHShpigaz8IAA/view"
            target="_blank"
            rel="noopener">
            🔓 by Ech0playsss
          </a>

          <p>
            Enter a website above to open it inside unLOCKED.
          </p>

          <div class="example-buttons">

            <button
              class="example"
              data-url="https://example.com">
              Example.com
            </button>

            <button
              class="example"
              data-url="https://www.wikipedia.org">
              Wikipedia
            </button>

          </div>

        </div>

      </div>

      <!-- Website iframe -->
      <iframe
        id="viewer"
        title="Website Viewer"
        sandbox="allow-forms allow-modals allow-popups allow-popups-to-escape-sandbox allow-presentation allow-scripts allow-same-origin"
        referrerpolicy="no-referrer"
        hidden>
      </iframe>

    </div>

    <!-- Status -->
    <div class="statusbar">

      <span class="status-dot"></span>

      <span id="statusText">
        Ready
      </span>

    </div>

  </div>

  <script>
    const urlInput = document.getElementById("urlInput");
    const goButton = document.getElementById("goButton");

    const viewer = document.getElementById("viewer");
    const homeScreen = document.getElementById("homeScreen");

    const backButton = document.getElementById("backButton");
    const forwardButton = document.getElementById("forwardButton");
    const reloadButton = document.getElementById("reloadButton");

    const statusText = document.getElementById("statusText");

    let history = [];
    let historyIndex = -1;

    function normalizeURL(input) {

      input = input.trim();

      if (!input) {
        return null;
      }

      if (/^https?:\/\//i.test(input)) {
        return input;
      }

      if (
        input.includes(".") &&
        !input.includes(" ")
      ) {
        return "https://" + input;
      }

      return "https://duckduckgo.com/?q=" +
        encodeURIComponent(input);
    }

    function loadURL(input, addToHistory = true) {

      const url = normalizeURL(input);

      if (!url) {
        return;
      }

      viewer.src = url;

      viewer.hidden = false;

      homeScreen.style.display = "none";

      urlInput.value = url;

      statusText.textContent =
        "Loading " + url;

      if (addToHistory) {

        history =
          history.slice(0, historyIndex + 1);

        history.push(url);

        historyIndex++;

        updateNavigationButtons();
      }
    }

    function updateNavigationButtons() {

      backButton.disabled =
        historyIndex <= 0;

      forwardButton.disabled =
        historyIndex >= history.length - 1;

      backButton.style.opacity =
        backButton.disabled ? "0.4" : "1";

      forwardButton.style.opacity =
        forwardButton.disabled ? "0.4" : "1";
    }

    goButton.addEventListener("click", () => {
      loadURL(urlInput.value);
    });

    urlInput.addEventListener("keydown", event => {

      if (event.key === "Enter") {
        loadURL(urlInput.value);
      }

    });

    backButton.addEventListener("click", () => {

      if (historyIndex > 0) {

        historyIndex--;

        const url =
          history[historyIndex];

        viewer.src = url;

        urlInput.value = url;

        statusText.textContent =
          "Loading " + url;

        updateNavigationButtons();
      }

    });

    forwardButton.addEventListener("click", () => {

      if (historyIndex < history.length - 1) {

        historyIndex++;

        const url =
          history[historyIndex];

        viewer.src = url;

        urlInput.value = url;

        statusText.textContent =
          "Loading " + url;

        updateNavigationButtons();
      }

    });

    reloadButton.addEventListener("click", () => {

      if (!viewer.hidden) {

        viewer.src = viewer.src;

        statusText.textContent =
          "Reloading...";
      }

    });

    viewer.addEventListener("load", () => {

      statusText.textContent =
        "Page loaded";

    });

    document
      .querySelectorAll(".example")
      .forEach(button => {

        button.addEventListener("click", () => {

          loadURL(button.dataset.url);

        });

      });

    updateNavigationButtons();
  </script>

</body>
</html>
